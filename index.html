<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>در حال بروزرسانی</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    font-family: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
    background: #0b1020;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(88, 101, 242, .25), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(0, 200, 255, .20), transparent 45%),
      radial-gradient(circle at 50% 0%, rgba(255, 0, 150, .12), transparent 55%);
    color: #fff;
    overflow: hidden;
  }

  /* ---- کارت اصلی ---- */
  .card {
    position: relative;
    width: 100%;
    max-width: 620px;
    padding: 48px 28px 40px;
    text-align: center;
    border-radius: 26px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    animation: fadeUp .8s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---- آیکون چرخ‌دنده ---- */
  .icon {
    width: 78px;
    height: 78px;
    margin: 0 auto 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: linear-gradient(145deg, #5865f2, #00c8ff);
    box-shadow: 0 0 32px rgba(88, 101, 242, .55);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 24px rgba(88, 101, 242, .45); }
    50%      { box-shadow: 0 0 46px rgba(0, 200, 255, .75); }
  }

  .icon svg {
    width: 40px;
    height: 40px;
    fill: #fff;
    animation: spin 4s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ---- متن‌ها ---- */
  h1 {
    font-size: clamp(1.5rem, 5vw, 2.1rem);
    font-weight: 800;
    letter-spacing: -.5px;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #ffffff, #9fb4ff, #00e0ff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: .98rem;
    line-height: 1.9;
    color: rgba(255, 255, 255, .68);
    margin-bottom: 34px;
  }

  .label {
    font-size: .85rem;
    letter-spacing: .5px;
    color: rgba(255, 255, 255, .55);
    margin-bottom: 14px;
  }

  /* ---- تایمر ---- */
  .timer {
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: 10px;
    margin-bottom: 18px;
    direction: ltr; /* چیدمان اعداد از چپ به راست */
  }

  .unit {
    flex: 1 1 0;
    min-width: 0;
    padding: 16px 6px 12px;
    border-radius: 16px;
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 255, 255, .12);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .10);
    transition: transform .2s ease;
  }

  .unit:hover {
    transform: translateY(-3px);
  }

  .num {
    display: block;
    font-size: clamp(1.7rem, 7vw, 2.6rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
    color: #fff;
    text-shadow: 0 0 18px rgba(120, 160, 255, .65);
  }

  .cap {
    display: block;
    margin-top: 6px;
    font-size: .72rem;
    color: rgba(255, 255, 255, .55);
  }

    font-size: 1.6rem;
