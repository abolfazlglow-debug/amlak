<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت در حال بروزرسانی است</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --border-color: #333333;
            --dim-color: #666666;
            --card-bg: #0a0a0a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: monospace, Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.02);
        }

        /* گوشه‌های دکوراتیو تکنیکال */
        .container::before, .container::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border: 1px solid var(--text-color);
        }
        .container::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .container::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .graphic-wrapper {
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
        }

        /* انیمیشن و جزییات تصویر مونوکروم مک‌بوک و برنامه نویس */
        .dev-svg {
            width: 100%;
            height: auto;
            filter: grayscale(100%) contrast(150%);
        }

        /* انیمیشن مانیتور و کیبورد */
        @keyframes typing-glow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .screen-code {
            animation: typing-glow 1.5s infinite alternate;
        }

        h1 {
            font-size: 1.8rem;
            text-align: center;
            letter-spacing: -1px;
            margin-bottom: 15px;
            text-transform: uppercase;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 15px;
            width: 100%;
        }

        p {
            color: var(--dim-color);
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.8;
            margin-bottom: 30px;
            max-width: 600px;
        }

        .terminal-box {
            width: 100%;
            background: #000;
            border: 1px solid var(--border-color);
            padding: 15px;
            font-size: 0.85rem;
            color: #ccc;
            text-align: left;
            direction: ltr;
            margin-bottom: 25px;
            min-height: 60px;
            display: flex;
            align-items: center;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: var(--text-color);
            margin-left: 5px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-color);
            padding: 6px 16px;
            font-size: 0.8rem;
            letter-spacing: 1px;
            background: #000;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px #fff;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }

        /* ریسپانسیو برای موبایل */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                border: none;
                background: transparent;
                box-shadow: none;
            }
            h1 {
                font-size: 1.3rem;
            }
            p {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- بخش گرافیکی پرجزییات برنامه نویس و مک‌بوک (کاملاً مونوکروم و وکتور) -->
        <div class="graphic-wrapper">
            <svg class="dev-svg" viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg">
                <!-- میز کار -->
                <rect x="50" y="270" width="400" height="10" fill="#222" />
                <rect x="80" y="280" width="340" height="30" fill="#111" />
                
                <!-- صندلی / پشت برنامه نویس -->
                <path d="M160,270 L190,140 L310,140 L340,270 Z" fill="#0f0f0f" stroke="#333" stroke-width="2"/>
                
                <!-- بدنه برنامه نویس (کدنویس پشت سیستم) -->
                <ellipse cx="250" cy="200" rx="45" ry="55" fill="#181818" />
                <circle cx="250" cy="125" r="24" fill="#222" />
                <!-- هودی / لباس تیره مونوکروم -->
                <path d="M205,230 Q250,170 295,230 Z" fill="#0a0a0a" stroke="#333" stroke-width="1.5"/>

                <!-- مک بوک (MacBook) با جزییات کامل -->
                <!-- بدنه لپ‌تاپ (صفحه نمایش) -->
                <rect x="175" y="70" width="150" height="100" rx="4" fill="#000" stroke="#fff" stroke-width="2"/>
                <rect x="180" y="75" width="140" height="90" fill="#050505" />
                
                <!-- کدهای روی صفحه نمایش مک‌بوک -->
                <g class="screen-code">
                    <line x1="190" y1="90" x2="240" y2="90" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
                    <line x1="190" y1="105" x2="270" y2="105" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="205" y1="120" x2="250" y2="120" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                    <line x1="205" y1="132" x2="280" y2="132" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
                    <line x1="190" y1="145" x2="230" y2="145" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                </g>

                <!-- پایه و بدنه پایین مک‌بوک -->
                <path d="M150,172 L350,172 L360,182 L140,182 Z" fill="#222" stroke="#444" stroke-width="1"/>
                <rect x="235" y="170" width="30" height="3" rx="1" fill="#555" />
                
                <!-- دست‌های برنامه نویس روی کیبورد -->
                <path d="M210,175 Q230,165 245,178" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>
                <path d="M290,175 Q270,165 255,178" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>

                <!-- جزییات میز: فنجان قهوه -->
                <rect x="360" y="240" width="22" height="30" rx="2" fill="#000" stroke="#444" stroke-width="1.5"/>
                <path d="M382,248 Q395,248 395,258 Q395,268 382,268" fill="none" stroke="#444" stroke-width="1.5"/>
                <!-- بخار فنجان -->
                <path d="M367,232 Q372,225 367,218" fill="none" stroke="#333" stroke-width="1" stroke-linecap="round"/>
                <path d="M375,232 Q380,225 375,218" fill="none" stroke="#333" stroke-width="1" stroke-linecap="round"/>
            </svg>
        </div>

        <h1>سایت در حال بروزرسانی است</h1>
        <p>ما در حال بازنویسی، بهینه‌سازی و ارتقای ساختار زیرساخت سایت هستیم. به زودی با نسخه‌ای سریع‌تر، امن‌تر و با امکانات جدید بازخواهیم گشت.</p>

        <!-- ترمینال کدنویسی با تایپ خودکار -->
        <div class="terminal-box">
            <span id="typed-text"></span><span class="cursor"></span>
        </div>

        <div class="status-badge">
            <span class="status-dot"></span>
            <span>SYSTEM_REBUILD_IN_PROGRESS</span>
        </div>
    </div>

    <script>
        // اسکریپت ساده برای شبیه‌سازی لاگ‌های ترمینال به سبک هکری/برنامه نویسی
        const logs = [
            "Initializing kernel update...",
            "Optimizing database indices & assets...",
            "Deploying secure microservices...",
            "System status: 84% completed...",
            "Waiting for deployment pipeline..."
        ];
        
        let logIndex = 0;
        let charIndex = 0;
        const typedTextElement = document.getElementById('typed-text');

        function typeWriter() {
            if (logIndex < logs.length) {
                if (charIndex < logs[logIndex].length) {
                    typedTextElement.textContent += logs[logIndex].charAt(charIndex);
                    charIndex++;
                    setTimeout(typeWriter, 40);
                } else {
                    setTimeout(() => {
                        eraseText();
                    }, 2000);
                }
            } else {
                logIndex = 0;
                typeWriter();
            }
        }

        function eraseText() {
            if (charIndex > 0) {
                typedTextElement.textContent = logs[logIndex].substring(0, charIndex - 1);
                charIndex--;
                setTimeout(eraseText, 20);
            } else {
                logIndex++;
                setTimeout(typeWriter, 500);
            }
        }

        // شروع انیمیشن ترمینال
        setTimeout(typeWriter, 1000);
    </script>
</body>
</html>
